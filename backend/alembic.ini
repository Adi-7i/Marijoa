# Alembic configuration for Marijoa Backend
#
# IMPORTANT: The real DATABASE_URL is NEVER stored here.
# alembic/env.py reads it from the .env file via app.core.config.get_settings().

[alembic]
script_location = alembic
prepend_sys_path = .

# Migration file naming: <rev>_<slug>.py
file_template = %%(rev)s_%%(slug)s

# Timezone for generated timestamps
timezone = UTC

# Truncate revision ID to 12 chars (Alembic default)
truncate_slug_length = 40

# Placeholder — overridden in alembic/env.py from settings.DATABASE_URL
sqlalchemy.url = postgresql+psycopg://user:password@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
